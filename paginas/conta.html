<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sua conta — EcoBreath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/auth.css">
<link rel="stylesheet" href="../css/dashboard.css">
<noscript><style>body{opacity:1;}</style></noscript>
</head>
<body>

<header class="auth-header">
  <nav class="wrap">
    <a class="brand" href="../index.html#top">
      <img src="../assets/icon-ecobreath.svg" alt="Ícone EcoBreath" class="brand-icon">
      EcoBreath
    </a>
  </nav>
</header>

<main class="dashboard-shell">
  <div class="wrap" style="max-width:640px;">
    <a class="auth-back" href="dashboard.html">&larr; Voltar para a central</a>
    <div class="eyebrow">Configurações</div>
    <h1 style="margin-bottom:28px;">Sua conta</h1>

    <div class="auth-card" style="max-width:none; padding:32px;">
      <h2 style="font-size:1.1rem; margin-bottom:18px;">Informações pessoais</h2>
      <form id="perfilForm" novalidate>
        <div class="field" id="perfilNomeField">
          <label for="perfilNome">Nome</label>
          <input type="text" id="perfilNome" name="nome" autocomplete="name">
          <div class="field-error">Digite seu nome.</div>
        </div>
        <button type="submit" class="auth-submit" style="width:auto; padding:10px 24px;">Salvar nome</button>
        <div class="auth-form-message" id="perfilMessage"></div>
      </form>
    </div>

    <div class="auth-card" style="max-width:none; padding:32px; margin-top:20px;">
      <h2 style="font-size:1.1rem; margin-bottom:6px;">E-mail</h2>
      <p style="color:var(--ink-soft); font-size:0.88rem; margin-bottom:18px;">E-mail atual: <strong id="emailAtual">carregando…</strong></p>
      <form id="emailForm" novalidate>
        <div class="field" id="novoEmailField">
          <label for="novoEmail">Novo e-mail</label>
          <input type="email" id="novoEmail" name="novoEmail" autocomplete="email">
          <div class="field-error">Digite um e-mail válido.</div>
        </div>
        <button type="submit" class="auth-submit" style="width:auto; padding:10px 24px;">Atualizar e-mail</button>
        <div class="auth-form-message" id="emailMessage"></div>
      </form>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/transitions.js"></script>
<script src="../js/conta.js"></script>
</body>
</html>
