<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central — EcoBreath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/auth.css">
<link rel="stylesheet" href="../css/dashboard.css">
<noscript><style>body{opacity:1;}</style></noscript>
</head>
<body>

<header class="auth-header">
  <nav class="wrap">
    <a class="brand" href="../index.html#top">
      <img src="../assets/icon-ecobreath.png" alt="Ícone EcoBreath" class="brand-icon">
      EcoBreath
    </a>
  </nav>
</header>

<main class="dashboard-shell">
  <div class="wrap">

    <section class="account-card">
      <div class="account-avatar" id="accountAvatar">?</div>
      <div class="account-info">
        <div class="account-name" id="accountName">Carregando…</div>
        <div class="account-email" id="accountEmail"></div>
      </div>
      <button class="btn btn-ghost" id="logoutBtn">Sair da conta</button>
    </section>

    <div class="dashboard-head">
      <div>
        <div class="eyebrow">Central de dados</div>
        <h1 id="welcomeTitle">Carregando…</h1>
      </div>
      <a class="btn btn-primary" href="cadastro-prototipo.html">+ Adicionar protótipo</a>
    </div>

    <div id="prototiposList" class="prototipos-grid"></div>

    <div id="emptyState" class="empty-state" style="display:none;">
      <p>Você ainda não tem nenhum protótipo cadastrado.</p>
      <a class="btn btn-primary" href="cadastro-prototipo.html">Cadastrar meu primeiro protótipo</a>
    </div>

    <div id="errorState" class="empty-state" style="display:none;">
      <p>Não foi possível carregar seus protótipos. Tente recarregar a página.</p>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/transitions.js"></script>
<script src="../js/dashboard.js"></script>
</body>
</html>
