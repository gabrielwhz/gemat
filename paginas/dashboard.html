<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central — Cortiça</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/auth.css">
<link rel="stylesheet" href="../css/dashboard.css">
<noscript><style>body{opacity:1;}</style></noscript>
</head>
<body>

<header class="auth-header">
  <nav class="wrap dashboard-nav">
    <a class="brand" href="../index.html#top">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C9 6 6 9 6 13a6 6 0 0012 0c0-4-3-7-6-11z" fill="#7c8f5b"/>
        <circle cx="12" cy="14" r="2.4" fill="#182c20"/>
      </svg>
      Cortiça
    </a>
    <div class="dashboard-user">
      <span class="dashboard-user-email" id="userEmail"></span>
      <button class="btn btn-ghost" id="logoutBtn">Sair</button>
    </div>
  </nav>
</header>

<main class="dashboard-shell">
  <div class="wrap">
    <div class="dashboard-head">
      <div>
        <div class="eyebrow">Central de dados</div>
        <h1 id="welcomeTitle">Carregando…</h1>
      </div>
      <a class="btn btn-primary" href="cadastro-prototipo.html">+ Adicionar protótipo</a>
    </div>

    <div id="prototiposList" class="prototipos-grid"></div>

    <div id="emptyState" class="empty-state" style="display:none;">
      <p>Você ainda não tem nenhum protótipo cadastrado.</p>
      <a class="btn btn-primary" href="cadastro-prototipo.html">Cadastrar meu primeiro protótipo</a>
    </div>

    <div id="errorState" class="empty-state" style="display:none;">
      <p>Não foi possível carregar seus protótipos. Tente recarregar a página.</p>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/transitions.js"></script>
<script src="../js/dashboard.js"></script>
</body>
</html>
