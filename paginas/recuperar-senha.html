<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar senha — EcoBreath</title>
<link rel="icon" href="assets/icon-ecobreath.svg" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/auth.css">
<noscript><style>body{opacity:1;}</style></noscript>
</head>
<body>

<header class="auth-header">
  <nav class="wrap">
    <a class="brand" href="../index.html#top">
      <img src="../assets/icon-ecobreath.svg" alt="Ícone EcoBreath" class="brand-icon">
      EcoBreath
    </a>
  </nav>
</header>

<main class="auth-shell">
  <div class="auth-card">
    <a class="auth-back" href="login.html">&larr; Voltar para o login</a>
    <div class="eyebrow">Central de dados</div>
    <h1>Recuperar senha</h1>
    <p class="auth-lede">Digite o e-mail da sua conta e enviaremos um link para você criar uma senha nova.</p>

    <form id="recoverForm" novalidate>
      <div class="field" id="recoverEmailField">
        <label for="recoverEmail">E-mail</label>
        <input type="email" id="recoverEmail" name="email" autocomplete="email" placeholder="voce@exemplo.com">
        <div class="field-error">Digite um e-mail válido.</div>
      </div>

      <button type="submit" class="auth-submit">Enviar link de recuperação</button>

      <div class="auth-form-message" id="recoverMessage"></div>
    </form>

    <div class="auth-switch">
      Lembrou a senha? <a href="login.html">Entrar</a>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/transitions.js"></script>
<script src="../js/recuperar-senha.js"></script>
</body>
</html>
