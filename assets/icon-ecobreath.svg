<svg viewBox="0 0 120 90" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ícone EcoBreath">
  <defs>
    <linearGradient id="leafGrad" x1="20" y1="80" x2="90" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#24402f"/>
      <stop offset="1" stop-color="#7c8f5b"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="20" y1="78" x2="105" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#24402f"/>
      <stop offset="1" stop-color="#b3803a"/>
    </linearGradient>
  </defs>

  <!-- folha -->
  <path d="M22 80 C20 42 46 14 88 13 C89 53 62 80 22 80 Z" fill="url(#leafGrad)"/>
  <!-- veia central -->
  <path d="M83 17 C56 33 36 54 24 77" stroke="#f7f6ee" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.55"/>

  <!-- onda inferior (ar/respiração) -->
  <path d="M20 76 C46 90 78 87 106 64" stroke="url(#waveGrad)" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- circuito -->
  <g fill="none" stroke="#b3803a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 47 L70 34 L82 22"/>
    <path d="M84 52 L84 30 L98 16"/>
  </g>
  <circle cx="82" cy="22" r="4.2" fill="#f7f6ee" stroke="#b3803a" stroke-width="3"/>
  <circle cx="98" cy="16" r="4.2" fill="#f7f6ee" stroke="#b3803a" stroke-width="3"/>
</svg>
