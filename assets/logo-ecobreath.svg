<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo EcoBreath — tecnologia e vida ambiental">
  <defs>
    <linearGradient id="leafGradFull" x1="20" y1="150" x2="180" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#24402f"/>
      <stop offset="1" stop-color="#7c8f5b"/>
    </linearGradient>
    <linearGradient id="waveGradFull" x1="20" y1="146" x2="205" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#24402f"/>
      <stop offset="1" stop-color="#b3803a"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c8f5b"/>
      <stop offset="1" stop-color="#b3803a"/>
    </linearGradient>
  </defs>

  <!-- arco decorativo superior -->
  <path d="M255 40 C 330 12, 500 12, 600 44" stroke="url(#arcGrad)" stroke-width="3" fill="none" opacity="0.55"/>

  <!-- ícone: folha + circuito -->
  <g transform="translate(10,25) scale(1.62)">
    <path d="M22 80 C20 42 46 14 88 13 C89 53 62 80 22 80 Z" fill="url(#leafGradFull)"/>
    <path d="M83 17 C56 33 36 54 24 77" stroke="#f7f6ee" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M20 76 C46 90 78 87 106 64" stroke="url(#waveGradFull)" stroke-width="6.5" fill="none" stroke-linecap="round"/>
    <g fill="none" stroke="#b3803a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M70 47 L70 34 L82 22"/>
      <path d="M84 52 L84 30 L98 16"/>
    </g>
    <circle cx="82" cy="22" r="4.2" fill="#f7f6ee" stroke="#b3803a" stroke-width="3"/>
    <circle cx="98" cy="16" r="4.2" fill="#f7f6ee" stroke="#b3803a" stroke-width="3"/>
  </g>

  <!-- palavra-marca -->
  <text x="252" y="120" font-family="Fraunces, serif" font-weight="700" font-size="60" fill="#182c20">EcoBreath</text>

  <!-- tagline -->
  <line x1="252" y1="150" x2="284" y2="150" stroke="#46523f" stroke-width="1.5"/>
  <text x="292" y="155" font-family="'Work Sans', sans-serif" font-weight="600" font-size="14" letter-spacing="1.1" fill="#46523f">TECNOLOGIA E VIDA AMBIENTAL</text>
  <line x1="576" y1="150" x2="608" y2="150" stroke="#46523f" stroke-width="1.5"/>

  <!-- arco decorativo inferior -->
  <path d="M252 182 C 340 212, 500 212, 592 178" stroke="url(#arcGrad)" stroke-width="3" fill="none" opacity="0.55"/>
</svg>
